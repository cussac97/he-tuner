name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # analysis regression checks on a generated session (decoding, dead keys, recommendations)
      - run: npm run check
      # typecheck + production build
      - run: npm run build
